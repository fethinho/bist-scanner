name: Daily BIST Scanner

on:
  schedule:
    # Runs every weekday (Monday-Friday) at 9:00 UTC
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Merdiven Hacim Scanner
      run: python merdiven_hacim_scanner.py
