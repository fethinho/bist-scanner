name: BIST Scanner Evening 18:30

on:
  schedule:
    # Her gün saat 18:30'da çalışır (UTC+3 = 15:30 UTC)
    - cron: '30 15 * * 1-5'  # Pazartesi-Cuma
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run BIST Scanner
        run: |
          python bist_scanner_auto.py
      
      - name: Success
        run: |
          echo "✅ Akşam taraması tamamlandı ve Telegram'a gönderildi!"
