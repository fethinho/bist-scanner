name: BIST Dip Avcisi - Otomatik Tarama

on:
  schedule:
    # UTC+3 saatleri UTC'ye çevrildi
    # 09:56 TR = 06:56 UTC
    - cron: '56 6 * * 1-5'
    # 11:00 TR = 08:00 UTC
    - cron: '0 8 * * 1-5'
    # 13:00 TR = 10:00 UTC
    - cron: '0 10 * * 1-5'
    # 16:00 TR = 13:00 UTC
    - cron: '0 13 * * 1-5'
    # 18:15 TR = 15:15 UTC
    - cron: '15 15 * * 1-5'
  workflow_dispatch:
    # Manuel tetikleme (isteğe bağlı)

jobs:
  bist-dip-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bist-dip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-bist-dip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance ta pandas numpy requests

      - name: Run BIST Dip Avcisi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bist_dip_avcisi.py

      - name: Upload CSV results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bist-dip-sonuclar-${{ github.run_number }}
          path: bist_dip_avcisi_sonuclar.csv
          retention-days: 7
