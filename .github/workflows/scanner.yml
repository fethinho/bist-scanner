name: BIST Scanner 15m

on:
  schedule:
    # Every 15 minutes between 06:00-15:00 UTC (09:00-18:00 Turkey time), Monday-Friday
    - cron: '*/15 6-15 * * 1-5'
  workflow_dispatch: # Manual run

jobs:
  scan_15m:
    name: 15 Dakika Taraması
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy ta requests pytz

      - name: Run 15m Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner_15m.py
